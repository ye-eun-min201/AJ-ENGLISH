<!doctype html>
<html lang="ko">
<head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta charset="UTF-8">
  <script src="/theme.js?v=aj23"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fa">
  <meta name="robots" content="noindex">
  <title>AJ ENGLISH · 로그인</title>
  <link rel="stylesheet" href="/typography.css?v=aj23">
  <link rel="stylesheet" href="/dark.css?v=aj23">
  <link rel="stylesheet" href="/stage.css?v=aj23">
  <link rel="stylesheet" href="/login.css?v=aj23">
</head>
<body class="aj-login">
  <main class="login-stage">
    <a class="login-brand" href="/" aria-label="AJ ENGLISH 첫 화면으로"><b>AJ</b> ENGLISH</a>
    <h1>기록을 <em>이어서</em> 저장해요</h1>
    <p class="login-lead">로그인하면 캐릭터·포인트·학습 기록이 계정에 저장되고, 휴대폰과 컴퓨터에서 같은 기록을 볼 수 있어요.</p>
    <p class="login-message" id="login-message" role="status" hidden></p>
    <div class="login-actions" id="login-actions">
      <a class="login-button kakao" id="login-kakao" href="/auth/kakao" hidden>카카오로 로그인</a>
      <a class="login-button google" id="login-google" href="/auth/google" hidden>구글로 로그인</a>
    </div>
    <p class="login-note">이름·이메일·프로필 사진은 받지 않아요. 로그인 확인용 회원번호만 저장합니다.</p>
    <a class="login-skip" id="login-skip" href="/">로그인 없이 둘러보기</a>
  </main>
  <noscript><p class="login-noscript">로그인하려면 JavaScript를 켜 주세요.</p></noscript>
  <script src="/login.js?v=aj23"></script>
</body>
</html>
